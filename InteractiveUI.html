                if (!chromosome) return 'C';

                const premise = chromosome.slice(64, 70);

                let myLast3, oppLast3;

                if (history.ai.length < 3) {
                    const movesNeeded = 3 - history.ai.length;
                    const myPremise = premise.slice(3 - movesNeeded, 3);
                    const oppPremise = premise.slice(6 - movesNeeded, 6);

                    if (myLast3[i] === 'D') {

                    }
                }
                for (let i = 0; i < 3; i++) {

                    }

                                            <button
                                                onClick={prevImage}
                                                className="absolute left-2 top-1/2 transform -translate-y-1/2 bg-purple-600/80 hover:bg-purple-700 text-white rounded-full p-3 transition-all shadow-lg"
                                                aria-label="Previous image"
                                            >
                                                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                                                    <path d="M15 19l-7-7 7-7"/>
                                                </svg>
                                            </button>
                                            
                                            <button
                                                onClick={nextImage}
                                                className="absolute right-2 top-1/2 transform -translate-y-1/2 bg-purple-600/80 hover:bg-purple-700 text-white rounded-full p-3 transition-all shadow-lg"
                                                aria-label="Next image"
                                            >
                                                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                                                    <path d="M9 5l7 7-7 7"/>
                                                </svg>
                                            </button>
                                            
                                            {/* Caption */}
                                            <div className="mt-4 text-center">
                                                <p className="text-purple-100 text-sm italic">{galleryImages[currentImageIndex].caption}</p>
                                                <p className="text-purple-300 text-xs mt-2">Image {currentImageIndex + 1} of {galleryImages.length}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="mt-6 bg-white/5 rounded-lg p-6 text-center">
                                        <div className="flex justify-center gap-6 mb-4">
                                            <a href="https://github.com/Tong-Bill/CS776_Final" target="_blank" rel="noopener noreferrer" className="text-purple-300 hover:text-purple-100 transition-colors inline-flex items-center gap-2">
                                                <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                                                </svg>
                                                GitHub
                                            </a>
                                            <a href="https://github.com/Tong-Bill/CS776_Final" target="_blank" rel="noopener noreferrer" className="text-purple-300 hover:text-purple-100 transition-colors inline-flex items-center gap-2">
                                                <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
                                                    <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                                                </svg>
                                                Report
                                            </a>
                                        </div>
                                        <p className="text-purple-200 text-sm">Created 2025 | Bill Tong CS776</p>
                                        <p className="text-purple-200 text-sm">Department of Computer Science and Engineering</p>
                                        <p className="text-purple-200 text-sm">University of Nevada, Reno, NV, USA</p>
                                        <p className="text-purple-300 text-sm mt-2 italic">Based Upon <em>The Evolution of Strategies in the Iterated Prisoner's Dilemma</em> (1987) by Robert Axelrod</p>
                                    </div>
                                </div>    
                            )}

                            {gameState === 'playing' && (
                                <div className="space-y-6">
                                    <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-2xl">
                                        <div className="flex justify-between items-center">
                                            <div className="text-center">
                                                <p className="text-purple-200 text-sm mb-1">Your Score</p>
                                                <p className="text-4xl font-bold text-white">{scores.player}</p>
                                            </div>
                                            <div className="text-center">
                                                <p className="text-purple-200 text-sm mb-1">Round</p>
                                                <p className="text-2xl font-bold text-purple-300">{currentRound + 1} / {maxRounds}</p>
                                            </div>
                                            <div className="text-center">
                                                <p className="text-purple-200 text-sm mb-1">AI Score</p>
                                                <p className="text-4xl font-bold text-white">{scores.ai}</p>
                                            </div>
                                        </div>
                                    </div>

                                    {lastOutcome && showingResult && (
                                        <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-2xl border-2 border-purple-400 animate-pulse">
                                            <h3 className="text-xl font-bold text-white mb-4 text-center">Round Result</h3>
                                            <div className="flex justify-around items-center">
                                                <div className="text-center">
                                                    <p className="text-purple-200 mb-2">You</p>
                                                    <div className={`text-5xl font-bold ${lastOutcome.playerMove === 'C' ? 'text-green-400' : 'text-red-400'}`}>
                                                        {lastOutcome.playerMove}
                                                    </div>
                                                    <p className="text-white mt-2">+{lastOutcome.outcome.player}</p>
                                                </div>
                                                <div className="text-3xl text-purple-300">vs</div>
                                                <div className="text-center">
                                                    <p className="text-purple-200 mb-2">AI</p>
                                                    <div className={`text-5xl font-bold ${lastOutcome.aiMove === 'C' ? 'text-green-400' : 'text-red-400'}`}>
                                                        {lastOutcome.aiMove}
                                                    </div>
                                                    <p className="text-white mt-2">+{lastOutcome.outcome.ai}</p>
                                                </div>
                                            </div>
                                            <p className="text-center text-purple-200 mt-4 italic">{lastOutcome.outcome.label}</p>
                                        </div>
                                    )}

                                    {!showingResult && (
                                        <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-8 shadow-2xl">
                                            <h3 className="text-2xl font-bold text-white mb-6 text-center">
                                                What will you do?
                                            </h3>
                                            <div className="grid grid-cols-2 gap-6">
                                                <button
                                                    onClick={() => handlePlayerMove('C')}
                                                    className="py-8 rounded-xl bg-gradient-to-br from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold text-2xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105"
                                                >
                                                    Cooperate
                                                </button>
                                                <button
                                                    onClick={() => handlePlayerMove('D')}
                                                    className="py-8 rounded-xl bg-gradient-to-br from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 text-white font-bold text-2xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105"
                                                >
                                                    Defect
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {history.player.length > 0 && (
                                        <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-2xl">
                                            <h3 className="text-xl font-bold text-white mb-4">Move History</h3>
                                            <div className="flex gap-2 flex-wrap max-h-32 overflow-y-auto">
                                                {history.player.map((move, idx) => (
                                                    <div key={idx} className="bg-white/20 rounded-lg p-2 text-center min-w-[60px]">
                                                        <p className="text-xs text-purple-200">R{idx + 1}</p>
                                                        <p className={`font-bold ${move === 'C' ? 'text-green-400' : 'text-red-400'}`}>
                                                            {move}
                                                        </p>
                                                        <p className={`font-bold ${history.ai[idx] === 'C' ? 'text-green-400' : 'text-red-400'}`}>
                                                            {history.ai[idx]}
                                                        </p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {gameState === 'finished' && (
                                <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-8 shadow-2xl text-center">
                                    <h2 className="text-3xl font-bold text-white mb-6">Game Over!</h2>
                                    
                                    <div className="grid grid-cols-2 gap-8 mb-8">
                                        <div className="bg-white/10 rounded-xl p-6">
                                            <p className="text-purple-200 mb-2">Your Final Score</p>
                                            <p className="text-5xl font-bold text-white">{scores.player}</p>
                                        </div>
                                        <div className="bg-white/10 rounded-xl p-6">
                                            <p className="text-purple-200 mb-2">AI Final Score</p>
                                            <p className="text-5xl font-bold text-white">{scores.ai}</p>
                                        </div>
                                    </div>

                                    <div className="bg-white/10 rounded-xl p-6 mb-8">
                                        {scores.player > scores.ai ? (
                                            <p className="text-2xl font-bold text-green-400">🎉 You Win!</p>
                                        ) : scores.player < scores.ai ? (
                                            <p className="text-2xl font-bold text-red-400">AI Wins!</p>
                                        ) : (
                                            <p className="text-2xl font-bold text-purple-300">It's a Tie!</p>
                                        )}
                                        <p className="text-purple-200 mt-4">
                                            Average score per round: You: {(scores.player / maxRounds).toFixed(2)} | AI: {(scores.ai / maxRounds).toFixed(2)}
                                        </p>
                                    </div>

                                    <div className="flex gap-4">
                                        <button
                                            onClick={resetGame}
                                            className="flex-1 py-4 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-bold text-lg shadow-lg hover:shadow-xl transition-all"
                                        >
                                            Play Again
                                        </button>
                                        <button
                                            onClick={() => setGameState('setup')}
                                            className="flex-1 py-4 rounded-lg bg-white/20 hover:bg-white/30 text-white font-bold text-lg transition-all"
                                        >
                                            New Game
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<PrisonersDilemmaGame />, document.getElementById('root'));
    </script>
</body>
</html>
